<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ludu Khela</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== LANDING PAGE ===== -->
  <div id="landing" class="screen">
    <h1 class="logo">🎲 Ludu Khela</h1>
    <button id="playBtn" class="big-btn">Play Game</button>
    <p class="hint">৪ জন একসাথে খেলুন</p>
  </div>

  <!-- ===== GAME SCREEN ===== -->
  <div id="game" class="screen hidden">
    <div id="turnBanner" class="turn-banner">Player 1 er turn</div>

    <div class="board-wrap">
      <canvas id="board" width="420" height="420"></canvas>
    </div>

    <div id="diceBox" class="dice-box">
      <span id="diceValue">–</span>
    </div>

    <div id="playersInfo" class="players-info"></div>
  </div>

  <!-- ===== 1 MATCH RUNNING (hidden, 7-tap পরে দেখাবে) ===== -->
  <div id="matchRunning" class="hidden overlay">
    <button id="matchRunningBtn" class="big-btn green">1 Match Running</button>
  </div>

  <!-- ===== CONTROLLER PANEL ===== -->
  <div id="controller" class="hidden overlay">
    <div class="panel">
      <h2>🎛️ Controller</h2>
      <div id="ctrlTurn" class="ctrl-turn">Player 1 er turn</div>
      <div id="ctrlDice" class="ctrl-dice">–</div>
      <button id="ctrlRollBtn" class="big-btn">Roll Dice</button>
      <button id="ctrlCloseBtn" class="close-btn">✕ Close</button>
    </div>
  </div>

  <script src="board.js"></script>
  <script src="game.js"></script>
</body>
</html>
