<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ludu Khela</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Landing Screen ===== -->
  <div id="landing" class="screen show">
    <h1 class="logo">🎲 Ludu Khela</h1>
    <p class="tagline">৪ জন একসাথে খেলুন</p>
    <button id="playBtn" class="big-btn">Play Game</button>
  </div>

  <!-- ===== Game Screen ===== -->
  <div id="game" class="screen">
    <div id="turnBanner" class="turn-banner">Player 1 er turn</div>
    <div class="board-wrap">
      <canvas id="board" width="600" height="600"></canvas>
    </div>
    <div class="dice-row">
      <div id="diceBox" class="dice-box">–</div>
    </div>
    <div id="playersInfo" class="players-info"></div>
  </div>

  <!-- ===== 1 Match Running Overlay (hidden) ===== -->
  <div id="matchRunning" class="overlay hidden">
    <button id="matchRunningBtn" class="big-btn green">1 Match Running</button>
  </div>

  <!-- ===== Controller Panel (hidden) ===== -->
  <div id="controller" class="overlay hidden">
    <div class="panel">
      <h2>🎛️ Controller</h2>
      <div id="ctrlTurn" class="ctrl-turn">Player 1 er turn</div>
      <div id="ctrlDice" class="ctrl-dice">–</div>
      <button id="ctrlRollBtn" class="big-btn">Roll Dice</button>
      <button id="ctrlCloseBtn" class="close-btn">✕ Close</button>
    </div>
  </div>

  <script src="board.js"></script>
  <script src="sound.js"></script>
  <script src="game.js"></script>
</body>
</html>
